# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: testing

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  all-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        golang:
          - '1.26.5'
          - 'stable'
        tarantool:
          - '2.11'
          - '3.6.2'
          - 'master'
        include:
          - tarantool: 'master'
            golang: '1.26.5'
            coverage: true

    steps:
      - name: Clone the connector
        uses: actions/checkout@v7

      - name: Setup tt
        run: |
          curl -L https://tarantool.io/release/2/installer.sh | sudo bash
          sudo apt install -y tt

      - name: Setup tt environment
        run: tt init

      - name: Setup Tarantool ${{ matrix.tarantool }}
        if: startsWith(matrix.tarantool, '2.')
        uses: tarantool/setup-tarantool@v4
        with:
          tarantool-version: ${{ matrix.tarantool }}

      - name: Setup Tarantool ${{ matrix.tarantool }}
        if: startsWith(matrix.tarantool, '3.')
        run: |
          curl -L https://tarantool.io/release/3/installer.sh | sudo bash
          sudo apt install -y tarantool=${{ matrix.tarantool }}-1

      - name: Get Tarantool master commit
        if: matrix.tarantool == 'master'
        run: |
          commit_hash=$(git ls-remote https://github.com/tarantool/tarantool.git --branch master | head -c 8)
          echo "LATEST_COMMIT=${commit_hash}" >> $GITHUB_ENV
        shell: bash

      - name: Cache Tarantool master
        if: matrix.tarantool == 'master'
        id: cache-latest
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/bin
            ${{ github.workspace }}/include
          key: cache-latest-${{ env.LATEST_COMMIT }}

      - name: Setup Tarantool master
        if: matrix.tarantool == 'master' && steps.cache-latest.outputs.cache-hit != 'true'
        run: sudo tt install tarantool master

      - name: Add Tarantool master to PATH
        if: matrix.tarantool == 'master'
        run: echo "${GITHUB_WORKSPACE}/bin" >> $GITHUB_PATH

      - name: Setup golang for the connector and tests
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.golang }}

      - name: Run tests
        run: |
          export START_PORT=33000
          export NREPLICASETS=5
          make test

      - name: Install goveralls
        if: ${{ matrix.coverage }}
        run: go install github.com/mattn/goveralls@latest

      - name: Send coverage
        if: ${{ matrix.coverage }}
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: goveralls -coverprofile=coverage.out -service=github